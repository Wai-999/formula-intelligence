name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20. The toolchain's own floors are higher than 20: jsdom
          # 30 declares `^22.22.2 || ^24.15.0 || >=26.0.0`, and Vite 8
          # declares `^20.19.0 || >=22.12.0`. On Node 20 the jsdom test
          # environment fails to construct at all — undici throws
          # "webidl.util.markAsUncloneable is not a function" 16 times and
          # every suite reports "no tests", which reads like a broken test
          # runner rather than an unsupported runtime.
          node-version: 22
          cache: npm
      - run: npm ci
      # Gate the deploy on lint + tests. Previously a broken build was the
      # only thing that could stop a bad commit reaching production; content
      # and logic regressions (the kind FIX_LOG is full of) shipped freely.
      - run: npm run lint
      - run: npm run validate:content
      - run: npm test
      - run: npm run build
      # Accessibility needs a real browser (contrast and focusability depend
      # on computed layout, which jsdom cannot provide), so this runs against
      # the built preview rather than in the unit-test pass.
      - run: npx playwright install --with-deps chromium
      # Both themes: a light palette that fails contrast would be invisible
      # to anyone who only ever tests in dark.
      - run: npm run a11y
      - run: npm run a11y:light
      # Cross-feature journeys against the real build. The unit suite checks
      # each piece; these check that the pieces still agree with each other
      # once wired together — the failure mode nothing else can see.
      - run: npm run e2e
      # Separate process: the Pyodide journey loads a WebAssembly runtime,
      # and sharing a browser lifecycle with the other journeys starves them.
      - run: npm run e2e:python
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
